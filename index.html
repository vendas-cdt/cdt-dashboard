<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Vendas CDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g9:#004d39;--g8:#007A5A;--g6:#00A078;--g1:#E6F9F3;--gold:#C8972B;--gold1:#FBF3E2;--red:#C0392B;--red1:#FBEAE8;
  --ink:#14302a;--mut:#62776f;--line:#e2ebe7;--bg:#f4f7f6;--card:#fff;--soft:#f6faf8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Arial,Calibri,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 56px}
/* topo */
.top{background:linear-gradient(135deg,var(--g9),var(--g8) 55%,var(--g6));color:#fff}
.top .wrap{padding-top:26px;padding-bottom:0}
.toprow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;opacity:.8}
h1{font-size:clamp(24px,3.2vw,34px);letter-spacing:-.6px;margin:6px 0 4px;font-weight:800}
.sub{opacity:.85;font-size:13px}
.clocks{display:flex;gap:10px;flex-wrap:wrap}
.clock{background:#ffffff17;border:1px solid #ffffff2b;border-radius:14px;padding:10px 14px;min-width:150px}
.clock small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.8;font-weight:700}
.clock b{font-size:19px;font-weight:800;letter-spacing:-.3px}
nav{display:flex;gap:4px;margin-top:22px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:#ffffffc4;padding:12px 16px;border-radius:12px 12px 0 0;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
nav button:hover{color:#fff;background:#ffffff12}
nav button.on{background:var(--bg);color:var(--g8)}
nav button .n{display:inline-block;margin-left:6px;background:var(--red);color:#fff;border-radius:9px;padding:0 7px;font-size:11px;line-height:18px}
section.view{display:none;padding-top:24px}
section.view.on{display:block}
h2{font-size:18px;margin:0 0 4px;letter-spacing:-.3px}
.lead{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 22px #0d3b2e0a}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt{margin-top:22px}
/* hero */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.big{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--g8)}
.big small{font-size:18px;color:var(--mut);letter-spacing:0;font-weight:600}
.bar{position:relative;height:12px;background:#e7f1ed;border-radius:12px;overflow:visible;margin:18px 0 8px}
.bar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--g8),var(--g6))}
.bar .proj{position:absolute;top:-5px;width:3px;height:22px;background:var(--gold);border-radius:2px}
.barlbl{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mini div{background:var(--soft);border-radius:12px;padding:12px}
.mini small,.kpi small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.mini b{font-size:20px;font-weight:800}
.kpi{padding:16px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.6px;margin:4px 0 2px}
.kpi span{font-size:11px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.ok{color:var(--g8)}.warn{color:var(--gold)}.bad{color:var(--red)}
.bg-ok{background:var(--g8)}.bg-warn{background:var(--gold)}.bg-bad{background:var(--red)}.bg-mut{background:#b9c6c1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap}
.p-ok{background:var(--g1);color:var(--g8)}.p-warn{background:var(--gold1);color:#93691a}.p-bad{background:var(--red1);color:var(--red)}.p-mut{background:#eef2f0;color:var(--mut)}
/* ranking */
.rank{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:22px 110px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.rk .pos{color:var(--mut);font-weight:700}
.rk .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .tr{height:10px;background:#eef4f1;border-radius:10px;position:relative}
.rk .tr i{position:absolute;inset:0 auto 0 0;border-radius:10px;background:var(--g6)}
.rk .tr em{position:absolute;inset:0 auto 0 0;border-radius:10px;background:#00a07833}
.rk .vl{text-align:right;font-weight:800}
.rk .vl small{display:block;font-size:10px;color:var(--mut);font-weight:600}
.legend{display:flex;gap:16px;color:var(--mut);font-size:11px;margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}
/* alertas */
.alerts{display:grid;gap:10px}
.al{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.al .ic{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px}
.al b{display:block}
.al span{color:var(--mut);font-size:12px}
/* vendedores */
.seg{display:inline-flex;background:#e9f1ee;border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;font-size:12px;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--g8);box-shadow:0 2px 6px #0d3b2e14}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sc header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sc h3{margin:0;font-size:18px;letter-spacing:-.3px}
.sc .who small{color:var(--mut);font-size:11px}
.sc .vv{text-align:right}
.sc .vv b{font-size:34px;font-weight:800;color:var(--g8);letter-spacing:-1px;line-height:1}
.sc .vv small{display:block;color:var(--mut);font-size:11px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.met{background:var(--soft);border-radius:12px;padding:11px}
.met small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.met b{font-size:20px;font-weight:800}
.met .mb{height:5px;background:#e3ece8;border-radius:5px;margin-top:7px;position:relative}
.met .mb i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.met .mb s{position:absolute;top:-3px;width:2px;height:11px;background:#7d8f88}
.met span{display:block;font-size:10px;color:var(--mut);margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .pace{font-size:12px;color:var(--mut)}
.foot .pace b{color:var(--ink)}
.btn{border:0;background:var(--g8);color:#fff;border-radius:10px;padding:9px 13px;font-weight:700;font-size:12px;cursor:pointer}
.btn:hover{background:var(--g9)}
.btn.ghost{background:var(--g1);color:var(--g8)}
/* tabelas */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;font-weight:700;text-align:center;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:800;background:var(--soft)}
.tbl .grp{border-left:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.delta{font-size:11px;font-weight:700;display:block}
.chk{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.c-ok{background:var(--g1);color:var(--g8)}.c-bad{background:var(--red1);color:var(--red)}.c-run{background:var(--gold1);color:#93691a}.c-na{background:#eef2f0;color:var(--mut)}
.rules{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
.rule{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.rule small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.rule b{display:block;font-size:20px;font-weight:800;color:var(--g8);margin-top:4px}
.rule span{font-size:11px;color:var(--mut)}
.note{background:var(--gold1);border:1px solid #efdcb3;color:#6f5216;padding:12px 14px;border-radius:12px;font-size:12px;margin-top:14px}
/* refut/tim */
.prog{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.prog .nm{font-weight:700}
.prog .slots{display:flex;gap:4px;flex-wrap:wrap}
.prog .slots i{width:20px;height:20px;border-radius:6px;background:#edf2f0}
.prog .slots i.f{background:var(--g6)}
.prog .slots i.x{background:var(--g8)}
.prog .vl{text-align:right;font-weight:800}
.qs{display:flex;gap:6px;flex-wrap:wrap}
/* carteira */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-width:170px}
.filters input{flex:1;min-width:200px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.sum button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.sum button.on{border-color:var(--g8);box-shadow:0 0 0 2px var(--g1)}
.sum b{display:block;font-size:22px;font-weight:800}
.sum small{color:var(--mut);font-size:11px;font-weight:600}
.sum .tiny{display:flex;gap:6px;margin-top:6px;font-size:10px;font-weight:700}
.wallet{margin-bottom:16px;padding:0;overflow:hidden}
.wallet>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--soft);border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.wallet>header h3{margin:0;font-size:16px}
.wgrp{padding:6px 18px 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:8px}
.row{display:grid;grid-template-columns:1.7fr 70px 160px 110px 70px;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid #eef3f1;font-size:13px}
.row .cn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row a{color:var(--g8);font-weight:700;text-decoration:none}
.row a:hover{text-decoration:underline}
.row .q{text-align:right;font-weight:700}
.rowh{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;border-top:0}
.empty{padding:26px;text-align:center;color:var(--mut)}
.fine{color:var(--mut);font-size:11px;margin-top:28px;line-height:1.7}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.mini{grid-template-columns:repeat(3,1fr)}.big{font-size:44px}
  .row{grid-template-columns:1fr auto;row-gap:2px}.row .dt{grid-column:2;grid-row:1;text-align:right;color:var(--mut)}.row .ph{grid-column:1}.row .pd{grid-column:1}.row .q{grid-column:2;grid-row:2}
  .rowh{display:none}.rk{grid-template-columns:18px 84px 1fr 56px}}
@media(max-width:480px){.wrap{padding:0 14px 40px}.g4{grid-template-columns:1fr 1fr}.rules{grid-template-columns:1fr 1fr}.mets{grid-template-columns:1fr 1fr 1fr}.met b{font-size:17px}.clock{min-width:0;flex:1}.clock b{font-size:16px}.mini b{font-size:17px}.kpi b{font-size:22px}}
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="toprow">
      <div>
        <div class="eyebrow">Cartão de TODOS · Campo Grande/MS</div>
        <h1>Painel de Vendas · <span id="mesRef"></span></h1>
        <div class="sub" id="subline"></div>
      </div>
      <div class="clocks">
        <div class="clock"><small>Fechamento do mês</small><b id="clkMes">--</b></div>
        <div class="clock"><small>Dias úteis restantes</small><b id="clkDu">--</b></div>
      </div>
    </div>
    <nav id="nav">
      <button data-v="geral" class="on">Visão geral</button>
      <button data-v="vend">Vendedores</button>
      <button data-v="prem">Premiação</button>
      <button data-v="rt">Refuturiza e TIM</button>
      <button data-v="comp">Comparativo</button>
      <button data-v="cart">Carteira pendente<span class="n" id="navPend"></span></button>
    </nav>
  </div>
</div>

<div class="wrap">
  <section class="view on" id="v-geral"></section>
  <section class="view" id="v-vend"></section>
  <section class="view" id="v-prem"></section>
  <section class="view" id="v-rt"></section>
  <section class="view" id="v-comp"></section>
  <section class="view" id="v-cart"></section>
  <p class="fine" id="fine"></p>
</div>

function crit(s){

  const status = bloq ? {t:'Bloqueado no mês', c:'p-bad'} : (proj ? {t:'No ritmo', c:'p-ok'} : {t:'Abaixo do ritmo', c:'p-warn'});
  return {c, status, bloq};
}

/* alertas */
function alertas(s){
  const a = [], cur = s[qa];
  if (cur.vendas && !cur.eleg){

    a.push({n:'bad', t:'Fora da elegibilidade na '+QN[qa], d:f.join(' · ')+'. Meta: APP 75% e PL 50%.'});
  }
  if (!cur.vendas) a.push({n:'bad', t:'Sem vendas na '+QN[qa], d:'Nenhuma venda registrada desde o dia 16.'});
  if (s.projecao < 100) a.push({n:'warn', t:'Projeção de '+s.projecao+' vendas', d:'Precisa de '+fmt(s.ritmo,1)+' vendas por dia útil para chegar a 100.'});

}

    </div>`;}).join('');
  $('#v-vend').innerHTML = `
    <div class="toolbar"><div><h2>Desempenho por vendedor</h2><p class="lead" style="margin:0">Elegibilidade por quinzena: APP a partir de 75% e PL a partir de 50%.</p></div>
      <div class="seg" id="segP">${['q1','q2','mes'].map(k=>`<button data-p="${k}" class="${k===P?'on':''}">${QN[k]}</button>`).join('')}</div></div>
    <div class="grid g2">${cards}</div>
    <p class="fine" style="margin-top:14px">Cashback: o relatório informa a faixa do mês (a partir de R$ 3,00). A exigência de R$ 5,00 em cada quinzena é conferida no fechamento.${S.some(s=>s.refut_pend)?' * Refuturiza da Polyana não informado no relatório, considerado 0 até confirmação.':''}</p>`;
  document.querySelectorAll('#segP button').forEach(b=>b.onclick=()=>{periodo=b.dataset.p;viewVend();});
  document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{cartSeller=b.dataset.cart; cartPer = periodo; viewCart(); go('cart');});
}

/* ===== PREMIAÇÃO ===== */
function viewPrem(){
  const ic = {ok:['c-ok','✓'], bad:['c-bad','✕'], run:['c-run','•'], na:['c-na','-']};
  const rows = [...S].sort((a,b)=>b.mes.vendas-a.mes.vendas).map(s=>{
    const r = crit(s);
    return `<tr><td><b>${esc(s.nome)}</b><br><span class="pill ${r.status.c}" style="margin-top:5px">${r.status.t}</span></td>
      ${r.c.map(x=>`<td><span class="chk ${ic[x.s][0]}">${ic[x.s][1]}</span><span class="delta" style="color:var(--mut);font-weight:600;margin-top:3px">${x.v}</span></td>`).join('')}</tr>`;
  }).join('');
  $('#v-prem').innerHTML = `
    <h2>Premiação de R$ 1.000</h2>
    <p class="lead">Todos os critérios precisam ser cumpridos no mês. Nenhum indicador sozinho libera a premiação.</p>
    <div class="rules">
      <div class="rule"><small>Vendas no mês</small><b>100</b><span>vendas realizadas</span></div>
      <div class="rule"><small>APP baixado</small><b>75%</b><span>em cada quinzena</span></div>
      <div class="rule"><small>PL ativa</small><b>50%</b><span>em cada quinzena</span></div>
      <div class="rule"><small>Refuturiza</small><b>3 + 3</b><span>por quinzena (6 no mês)</span></div>
      <div class="rule"><small>TIM Controle</small><b>2 + 2</b><span>por quinzena (4 no mês)</span></div>
      <div class="rule"><small>Cashback</small><b>R$ 5 + 5</b><span>por quinzena (R$ 10 no mês)</span></div>
    </div>
    <div class="card scroll"><table class="tbl">
      <thead><tr><th>Vendedor</th><th>100 vendas</th><th>APP/PL 1ª Q</th><th>APP/PL 2ª Q</th><th>Refut. 1ª Q</th><th>Refut. 2ª Q</th><th>TIM mês</th><th>Cashback</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="legend" style="margin-top:12px"><span><span class="chk c-ok" style="width:16px;height:16px;font-size:9px">✓</span> Cumprido</span><span><span class="chk c-run" style="width:16px;height:16px;font-size:9px">•</span> Em andamento</span><span><span class="chk c-bad" style="width:16px;height:16px;font-size:9px">✕</span> Não cumprido (quinzena fechada)</span></div>
    <div class="note">TIM Controle foi informado no total do mês, sem divisão por quinzena; o painel confere a meta de 4 no mês. O relatório de cashback traz só a faixa do mês: quem está zerado não gerou nada na 1ª quinzena e fica bloqueado; quem gerou aparece em andamento até a conferência dos R$ 5,00 em cada quinzena. Status "No ritmo" considera a projeção de vendas para o fechamento.</div>`;
}

/* ===== REFUTURIZA E TIM ===== */
function slots(n,meta){ let h=''; for(let i=0;i<Math.max(meta,n);i++) h+=`<i class="${i<n?(i<meta?'f':'x'):''}"></i>`; return h; }
function viewRT(){
  const ordR = [...S].sort((a,b)=>(b.refut[0]+b.refut[1])-(a.refut[0]+a.refut[1]));
  const ordT = [...S].sort((a,b)=>b.tim-a.tim);
  const q = (v,l,closed) => `<span class="pill ${v>=3?'p-ok':closed?'p-bad':'p-warn'}">${l}: ${v}/3</span>`;
  const aviso = D.rt_aguardando ? `
  <div class="note" style="margin:0 0 14px;font-size:13px">
    <b>Aguardando informe atualizado de Refuturiza e TIM Controle.</b> Os números abaixo são do último informe (${D.rt_informe}).
    A inserir no próximo envio: Refuturiza da 2ª quinzena por vendedor, total de Refuturiza da unidade e TIM Controle do mês por vendedor.
  </div>` : '';
  $('#v-rt').innerHTML = aviso + `
  <div class="grid g2">
    <div class="card">
      <h2>Refuturiza</h2>
      <p class="lead">Meta individual: 3 ativações por quinzena (6 no mês). Meta da empresa: ${D.meta_refut} no mês.</p>
      <div class="bar" style="margin-top:6px"><i style="width:${D.refut_unid/D.meta_refut*100}%"></i></div>
      <div class="barlbl"><span><b style="color:var(--ink)">${D.refut_unid}</b> de ${D.meta_refut} na unidade</span><span>faltam ${D.meta_refut-D.refut_unid}</span></div>
      <div style="margin-top:12px">${ordR.map(s=>`
        <div class="prog"><span class="nm">${esc(s.nome)}${s.refut_pend?' *':''}</span>
          <div><div class="slots">${slots(s.refut[0]+s.refut[1],6)}</div><div class="qs" style="margin-top:6px">${q(s.refut[0],'1ª Q',qa==='q2')}${D.rt_aguardando?'<span class="pill p-warn">2ª Q: a informar</span>':q(s.refut[1],'2ª Q',false)}</div></div>
          <span class="vl">${s.refut[0]+s.refut[1]}/6</span></div>`).join('')}</div>
      <p class="fine" style="margin-top:10px">Ativações e divisão por quinzena conforme relatório de vendas Refuturiza de ${D.rt_informe.slice(0,5)}. O total da unidade inclui ativações de quem não está no painel.${ordR.some(s=>s.refut_pend)?' * Polyana sem número no relatório, considerado 0 até confirmação.':''}</p>
    </div>
    <div class="card">
      <h2>TIM Controle</h2>
      <p class="lead">Meta individual: 2 por quinzena (4 no mês). Meta da empresa: ${D.meta_tim} no mês.</p>
      <div class="bar" style="margin-top:6px"><i style="width:${D.tim_unid/D.meta_tim*100}%"></i></div>
      <div class="barlbl"><span><b style="color:var(--ink)">${D.tim_unid}</b> de ${D.meta_tim} na unidade · ${D.tim_time} do time</span><span>faltam ${D.meta_tim-D.tim_unid}</span></div>
      <div style="margin-top:12px">${ordT.map(s=>`
        <div class="prog"><span class="nm">${esc(s.nome)}</span>
          <div class="slots">${slots(s.tim,4)}</div>
          <span class="vl ${s.tim>=4?'ok':s.tim>=2?'warn':'bad'}">${s.tim}/4</span></div>`).join('')}</div>
      <p class="fine" style="margin-top:10px">Números por vendedor informados pela gestão, com as vendas de Rebeca e Joyce lançadas em ${D.rt_informe.slice(0,5)}${D.rt_aguardando?' (último informe: '+D.rt_informe+', aguardando atualização)':''}. Faltam ${S.reduce((a,s)=>a+Math.max(0,4-s.tim),0)} vendas para todo o time bater a meta individual.</p>
      <details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)">Controle de vendas TIM da unidade (${D.tim_lista.length})</summary>
        <div style="margin-top:8px">${D.tim_lista.map(t=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line,#e6ebe9);font-size:13px"><span>${esc(t.c)}</span><span style="color:var(--mut);white-space:nowrap">${t.v?esc(t.v)+' · ':''}${t.d||'recente'}</span></div>`).join('')}</div>
      </details>
    </div>
  </div>`;
}

/* ===== COMPARATIVO ===== */
function dl(a,b,suf){
  if (a==null || b==null) return '<span class="delta" style="color:var(--mut)">-</span>';
  const d = b-a; const c = d>0?'ok':d<0?'bad':'';
  return `<span class="delta ${c}">${d>0?'▲ +':d<0?'▼ ':''}${fmt(d,suf?1:0)}${suf||''}</span>`;
}
function viewComp(){
  const agg = k => { const xs = S.map(s=>s[k]).filter(x=>x.vendas); const n = xs.reduce((a,x)=>a+x.vendas,0);
    const w = f => n? xs.reduce((a,x)=>a+x[f]*x.vendas,0)/n : null; return {vendas:n, app:w('app'), pl:w('pl'), qyc:w('qyc')}; };
  const T1 = agg('q1'), T2 = agg('q2'), TM = agg('mes');
  const line = (nome,a,b,m) => `<tr><td><b>${nome}</b></td>
    <td class="grp">${a.vendas}</td><td>${b.vendas}${dl(a.vendas,b.vendas)}</td>
    <td class="grp">${pct(a.app)}</td><td>${pct(b.app)}${dl(a.app,b.app,' p.p.')}</td>
    <td class="grp">${pct(a.pl)}</td><td>${pct(b.pl)}${dl(a.pl,b.pl,' p.p.')}</td>
    <td class="grp">${pct(a.qyc)}</td><td>${pct(b.qyc)}${dl(a.qyc,b.qyc,' p.p.')}</td>
    <td class="grp"><b>${m.vendas}</b></td></tr>`;
  $('#v-comp').innerHTML = `
    <h2>Comparativo 1ª x 2ª quinzena</h2>
    <p class="lead">A 2ª quinzena está em andamento (dados até ${D.ultima_data}). Variação em pontos percentuais (p.p.) para APP, PL e qualidade.</p>
    <div class="card scroll"><table class="tbl">
      <thead><tr><th rowspan="2">Vendedor</th><th colspan="2" class="grp">Vendas</th><th colspan="2" class="grp">% APP</th><th colspan="2" class="grp">% PL</th><th colspan="2" class="grp">% Qualidade</th><th class="grp">Mês</th></tr>
      <tr><th class="grp">1ª Q</th><th>2ª Q</th><th class="grp">1ª Q</th><th>2ª Q</th><th class="grp">1ª Q</th><th>2ª Q</th><th class="grp">1ª Q</th><th>2ª Q</th><th class="grp">Total</th></tr></thead>
      <tbody>${S.map(s=>line(esc(s.nome),s.q1,s.q2,s.mes)).join('')}</tbody>
      <tfoot>${line('Time',T1,T2,TM)}</tfoot></table></div>
    <p class="fine" style="margin-top:12px">Vendas recentes ainda podem ter APP, PL e qualidade cadastral em processamento, o que derruba os percentuais da 2ª quinzena nos primeiros dias.</p>`;
}

/* ===== CARTEIRA ===== */
const PR = {1:{t:'APP + PL pendentes',c:'bad',p:'p-bad'},2:{t:'Só APP pendente',c:'warn',p:'p-warn'},3:{t:'Só PL pendente',c:'warn',p:'p-warn'}};
const PRCOR = {1:'var(--red)',2:'var(--gold)',3:'#d9b45c'};
function viewCart(){
  const per = p => cartPer==='mes' || p.q===cartPer;
  const sumCards = S.map(s=>{ const l = s.pend.filter(per);
    return `<button data-s="${esc(s.nome)}" class="${cartSeller===s.nome?'on':''}"><small>${esc(s.nome)}</small><b>${l.length}</b>
      <div class="tiny"><span class="bad">${l.filter(p=>p.p===1).length} ambos</span><span class="warn">${l.filter(p=>p.p===2).length} APP</span><span style="color:#b08a35">${l.filter(p=>p.p===3).length} PL</span></div></button>`;}).join('');
  const list = S.filter(s=>cartSeller==='todos'||s.nome===cartSeller).map(s=>{
    const l = s.pend.filter(p=>per(p) && (!cartPrio||p.p===cartPrio) && (!cartBusca || p.c.toLowerCase().includes(cartBusca) || p.f.replace(/\D/g,'').includes(cartBusca.replace(/\D/g,'')||'#')));
    if (!l.length) return cartSeller==='todos' ? '' : `<div class="card wallet"><header><h3>${esc(s.nome)}</h3></header><div class="empty">Nenhum cliente pendente com esses filtros.</div></div>`;
    const grp = [1,2,3].map(k=>{ const g = l.filter(p=>p.p===k); if(!g.length) return '';
      return `<div class="wgrp" style="color:${PRCOR[k]}"><span class="dot" style="background:${PRCOR[k]}"></span>${PR[k].t} · ${g.length}</div>
        <div class="row rowh"><span>Cliente</span><span>Venda</span><span>Telefone</span><span>Pendência</span><span class="q">QYC</span></div>
        ${g.map(p=>`<div class="row"><span class="cn">${esc(p.c)}</span><span class="dt">${p.d}</span>
          <span class="ph">${p.w?`<a href="https://wa.me/${p.w}" target="_blank" rel="noopener">${p.f}</a>`:p.f}</span>
          <span class="pd"><span class="pill ${PR[k].p}">${k===1?'APP e PL':k===2?'APP':'PL'}</span></span>
          <span class="q ${p.qyc>=75?'ok':'bad'}">${p.qyc}%</span></div>`).join('')}`;}).join('');
    const cur = s[cartPer]||s.mes;
    return `<div class="card wallet"><header><h3>${esc(s.nome)} <span style="color:var(--mut);font-weight:600;font-size:13px">· ${l.length} cliente${l.length>1?'s':''}</span></h3>
      <div class="chips"><span class="pill ${lvl(cur.app,75)==='ok'?'p-ok':'p-bad'}">APP ${pct(cur.app)}</span><span class="pill ${lvl(cur.pl,50)==='ok'?'p-ok':'p-bad'}">PL ${pct(cur.pl)}</span></div></header>${grp}</div>`;
  }).join('');
  $('#v-cart').innerHTML = `
    <h2>Carteira pendente</h2>
    <p class="lead">Clientes sem APP baixado e/ou sem PL ativa. Prioridade de cima para baixo. Toque no telefone para abrir o WhatsApp.</p>
    <div class="filters">
      <select id="fS"><option value="todos">Todos os vendedores</option>${S.map(s=>`<option ${cartSeller===s.nome?'selected':''}>${esc(s.nome)}</option>`).join('')}</select>
      <div class="seg" id="fP">${['q1','q2','mes'].map(k=>`<button data-p="${k}" class="${k===cartPer?'on':''}">${k==='mes'?'Mês todo':QN[k]}</button>`).join('')}</div>
      <div class="seg" id="fR">${[[0,'Todas'],[1,'APP + PL'],[2,'Só APP'],[3,'Só PL']].map(([k,t])=>`<button data-r="${k}" class="${k===cartPrio?'on':''}">${t}</button>`).join('')}</div>
      <input id="fB" type="search" placeholder="Buscar cliente ou telefone" value="${esc(cartBusca)}">
    </div>
    <div class="sum">${sumCards}</div>
    <div id="cartList">${list || '<div class="card empty">Nenhum cliente pendente com esses filtros.</div>'}</div>`;
  $('#fS').onchange = e => {cartSeller = e.target.value; viewCart();};
  document.querySelectorAll('#fP button').forEach(b=>b.onclick=()=>{cartPer=b.dataset.p;viewCart();});
  document.querySelectorAll('#fR button').forEach(b=>b.onclick=()=>{cartPrio=+b.dataset.r;viewCart();});
  document.querySelectorAll('.sum button').forEach(b=>b.onclick=()=>{cartSeller = cartSeller===b.dataset.s?'todos':b.dataset.s; viewCart();});
  const fb = $('#fB'); fb.oninput = e => {cartBusca = e.target.value.trim().toLowerCase(); const pos = fb.selectionStart; viewCart(); const n=$('#fB'); n.focus(); n.setSelectionRange(pos,pos);};
}

$('#fine').innerHTML = `Fontes: Vendas Realizadas (vendas, APP, PL e qualidade por vendedor, filtrados por quinzena), Produtividade (somente total da unidade) e Cashback do mês. Refuturiza e TIM Controle conforme relatório da gestão. Dias úteis: ${D.du} no mês (feriado 12/10), ${D.du_pass} já trabalhados. Atualizado em ${D.gerado}.`;
viewGeral(); viewVend(); viewPrem(); viewRT(); viewComp(); viewCart();
})();
</script>
</body>
</html>
